version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: 3facil_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./database_storage:/app/database_storage
      - ./uploads_imoveis:/app/uploads_imoveis
      - ./uploads:/app/uploads
    environment:
      - NODE_ENV=production
      - PORT=3000

