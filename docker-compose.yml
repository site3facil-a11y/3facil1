version: '3.8'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
        GIT_REPO: ${GIT_REPO:-site3facil-a11y/3facil1}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    container_name: 3facil_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./uploads_imoveis:/app/uploads_imoveis
      - ./uploads:/app/uploads
    environment:
      - NODE_ENV=production
      - PORT=3000
