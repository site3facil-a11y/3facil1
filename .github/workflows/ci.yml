name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: tresfacil_app_user
          POSTGRES_PASSWORD: TestPostgresPassword123!
          POSTGRES_DB: 3facil_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint and Type Check
        run: npm run lint

      - name: Run Disk Mode Tests (without DATABASE_URL)
        run: npm run test:disk
        env:
          NODE_ENV: test
          JWT_SECRET: ci_test_jwt_secret_must_be_at_least_32_characters_long_for_security

      - name: Run PostgreSQL Integration Tests (with PostgreSQL container)
        run: npm run test:pg
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://tresfacil_app_user:TestPostgresPassword123!@localhost:5432/3facil_db
          JWT_SECRET: ci_test_jwt_secret_must_be_at_least_32_characters_long_for_security

      - name: Security Audit
        run: npm audit --audit-level=high

      - name: Verify Git Ignore Integrity for src/
        run: |
          IGNORED=$(git check-ignore src/* src/**/* 2>/dev/null || true)
          if [ -n "$IGNORED" ]; then
            echo "ERROR: The following files in src/ are erroneously ignored by .gitignore:"
            echo "$IGNORED"
            exit 1
          fi

      - name: Build Application
        run: npm run build
