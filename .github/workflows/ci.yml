name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint and Type Check
        run: npm run lint

      - name: Run Test Suite
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: ci_test_jwt_secret_must_be_at_least_32_characters_long_for_security

      - name: Security Audit
        run: npm audit --audit-level=high

      - name: Verify Git Ignore Integrity for src/
        run: |
          IGNORED=$(git check-ignore src/* src/**/* 2>/dev/null || true)
          if [ -n "$IGNORED" ]; then
            echo "ERROR: The following files in src/ are erroneously ignored by .gitignore:"
            echo "$IGNORED"
            exit 1
          fi

      - name: Build Application
        run: npm run build
